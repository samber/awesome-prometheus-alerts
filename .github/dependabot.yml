---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "monthly"

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"
