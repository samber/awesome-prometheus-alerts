---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
