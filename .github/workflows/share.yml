name: Share CLI and server

on:
  pull_request:
    paths:
      - cli/**
      - server/**
      - .github/workflows/share.yml
  push:
    branches:
      - master
    paths:
      - cli/**
      - server/**
      - .github/workflows/share.yml

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: server

      - name: Test
        run: go test -race ./...

      - name: Build Docker image
        run: docker build --tag share-server:ci .

  cli:
    name: npx CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run
