groups:

- name: ThanosComponentAbsent

  
  rules:

    # Adjust the job=~".*thanos-compact.*" regex to match your Prometheus job naming convention. absent() fires only once every matching replica has disappeared, not for a single instance going down.
    - alert: ThanosCompactIsDown
      expr: 'absent(up{job=~".*thanos-compact.*"} == 1)'
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Thanos Compact Is Down (instance {{ $labels.instance }})
        description: "ThanosCompact has disappeared. Prometheus target for the component cannot be discovered.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    # Adjust the job=~".*thanos-query.*" regex to match your Prometheus job naming convention. absent() fires only once every matching replica has disappeared, not for a single instance going down.
