# External Secrets Operator v2.15.0: status_condition gauges carry name, namespace,
# condition and status labels; only the current status is 1, the opposite one is 0.
# provider_api_calls_count is a counter with provider, call and status (success|error).
rule_files:
- rules/external-secrets-operator/embedded-exporter.yml
evaluation_interval: 1m
tests:
- name: ExternalSecret that stopped syncing
  interval: 1m
  input_series:
  - series: externalsecret_status_condition{instance="10.0.0.5:8080",job="external-secrets",name="db-creds",namespace="app",condition="Ready",status="True"}
    values: 0x15
  - series: externalsecret_status_condition{instance="10.0.0.5:8080",job="external-secrets",name="db-creds",namespace="app",condition="Ready",status="False"}
    values: 1x15
  - series: externalsecret_status_condition{instance="10.0.0.5:8080",job="external-secrets",name="api-key",namespace="app",condition="Ready",status="True"}
    values: 1x15
  - series: externalsecret_status_condition{instance="10.0.0.5:8080",job="external-secrets",name="api-key",namespace="app",condition="Ready",status="False"}
    values: 0x15
  alert_rule_test:
  - eval_time: 9m
    alertname: ExternalSecretsExternalsecretNotReady
    exp_alerts: []
  - eval_time: 10m
    alertname: ExternalSecretsExternalsecretNotReady
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: 10.0.0.5:8080
        job: external-secrets
        name: db-creds
        namespace: app
        condition: Ready
        status: "False"
      exp_annotations:
        summary: External Secrets ExternalSecret not ready (instance 10.0.0.5:8080)
        description: "ExternalSecret app/db-creds failed to sync. The target Secret keeps its last synced data or does not exist yet. Check the ExternalSecret events.\n  VALUE = 1\n  LABELS = map[__name__:externalsecret_status_condition condition:Ready instance:10.0.0.5:8080 job:external-secrets name:db-creds namespace:app status:False]"
- name: provider API error ratio
  interval: 1m
  input_series:
  - series: externalsecret_provider_api_calls_count{instance="10.0.0.5:8080",job="external-secrets",provider="AWS/SecretsManager",call="GetSecretValue",status="success"}
    values: 0+90x15
  - series: externalsecret_provider_api_calls_count{instance="10.0.0.5:8080",job="external-secrets",provider="AWS/SecretsManager",call="GetSecretValue",status="error"}
    values: 0+10x15
  - series: externalsecret_provider_api_calls_count{instance="10.0.0.5:8080",job="external-secrets",provider="Vault",call="Read",status="success"}
    values: 0+100x15
  alert_rule_test:
  - eval_time: 10m
    alertname: ExternalSecretsProviderApiErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        provider: AWS/SecretsManager
        call: GetSecretValue
      exp_annotations:
        summary: External Secrets provider API errors (instance )
        description: "10% of the GetSecretValue calls to provider AWS/SecretsManager failed in the last 5 minutes.\n  VALUE = 0.09999999999999999\n  LABELS = map[call:GetSecretValue provider:AWS/SecretsManager]"
- name: idle provider
  interval: 1m
  input_series:
  - series: externalsecret_provider_api_calls_count{instance="10.0.0.5:8080",job="external-secrets",provider="Vault",call="Read",status="success"}
    values: 5x15
  - series: externalsecret_provider_api_calls_count{instance="10.0.0.5:8080",job="external-secrets",provider="Vault",call="Read",status="error"}
    values: 1x15
  alert_rule_test:
  - eval_time: 10m
    alertname: ExternalSecretsProviderApiErrors
    exp_alerts: []
