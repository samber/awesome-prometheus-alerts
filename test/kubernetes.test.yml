# Kubernetes v1.37.0 x509.go:50-74: only native certificate bucket boundaries.
# The histogram is job-wide; the count side retains per-target labels and values.
rule_files:
- rules/kubernetes/kubestate-exporter.yml
evaluation_interval: 1m
tests:
- name: one-hour certificate with target labels
  interval: 1m
  input_series:
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="0"}
    values: '0x30'
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="1800"}
    values: '0x30'
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="3600"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="7200"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="21600"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="43200"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="86400"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="172800"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="345600"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="604800"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="2592000"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="7776000"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="15552000"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="31104000"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="10.0.0.1:6443",le="+Inf"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_count{job="apiserver",instance="10.0.0.1:6443"}
    values: 0+10x30
  - series: apiserver_client_certificate_expiration_seconds_sum{job="apiserver",instance="10.0.0.1:6443"}
    values: 0+36000x30
  alert_rule_test:
  - eval_time: 10m
    alertname: KubernetesClientCertificateExpiresSoon
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: 10.0.0.1:6443
        job: apiserver
      exp_annotations:
        summary: Kubernetes client certificate expires soon (instance 10.0.0.1:6443)
        description: "A client certificate used to authenticate to the apiserver is expiring in less than 24.0 hours.\n\
          \  VALUE = 100\n  LABELS = map[__name__:apiserver_client_certificate_expiration_seconds_count instance:10.0.0.1:6443\
          \ job:apiserver]"
  - eval_time: 10m
    alertname: KubernetesClientCertificateExpiresNextWeek
