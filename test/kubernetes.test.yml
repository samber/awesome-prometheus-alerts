- name: same semantic version
  interval: 1m
  input_series:
  - series: kubernetes_build_info{git_version="v1.37.0",instance="node0"}
    values: 1x20
  - series: kubernetes_build_info{git_version="v1.37.0+build",instance="node1"}
    values: 1x20
  alert_rule_test:
  - eval_time: 9m
    alertname: KubernetesVersionMismatch
    exp_alerts: []
  - eval_time: 10m
    alertname: KubernetesVersionMismatch
    exp_alerts: []
- name: version mismatch
  interval: 1m
  input_series:
  - series: kubernetes_build_info{git_version="v1.36.0",instance="node0"}
    values: 1x20
  - series: kubernetes_build_info{git_version="v1.37.0",instance="node1"}
    values: 1x20
  alert_rule_test:
  - eval_time: 9m
    alertname: KubernetesVersionMismatch
    exp_alerts: []
  - eval_time: 10m
    alertname: KubernetesVersionMismatch
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Kubernetes version mismatch (instance )
        description: "There are 2 different semantic versions of Kubernetes components running simultaneously, which\
          \ may indicate a partial or stalled cluster upgrade.\n  VALUE = 2\n  LABELS = map[]"
